name: Bug report
description: Something does not work, or produces output you did not expect.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This library is deterministic: a seed, a profile and a version reproduce the
        exact bytes you saw. With those three, a maintainer can reproduce your bundle
        precisely rather than guessing — so they are asked for first.

  - type: input
    id: version
    attributes:
      label: Version
      description: "`python -c \"import carebundle; print(carebundle.__version__)\"`"
      placeholder: "0.1.2"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The smallest snippet that shows it. Please include the **seed** and **profile** —
        without them the output cannot be reproduced, and almost every question starts
        with "what did that bundle actually contain".
      render: python
      placeholder: |
        from carebundle import generate_bundle
        bundle = generate_bundle(profile="type2_diabetes", seed=42, sex="F")
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.12 on macOS 15"
    validations:
      required: true
