[project]
# Placeholder name — the FHIR trademark policy rules out `fhirforge`/`synthfhir`,
# and the final name is settled before first publish (build doc Section 15).
name = "pkg"
version = "0.1.0"
description = "Clinically coherent synthetic FHIR(R) R4 test data for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.scripts]
pkg = "pkg.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "conformance: runs the HL7 validator (slow, needs a JVM)",
    "fidelity: statistical assertions over large seeded samples (slow)",
]

[tool.coverage.run]
source = ["pkg"]
omit = [
    # Generated from the R4 spec and checked by the conformance gate, not by unit
    # tests; 886 statements of generated models would flatter the number.
    "pkg/models/r4.py",
    # Offline build tooling, equivalent to build scripts. codegen is verified by the
    # stale-model check in CI, and the NHANES reader's parsing is unit-tested
    # through pkg/calibration/xpt.py.
    "pkg/spec/codegen.py",
    "pkg/calibration/nhanes.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 90
# Generated code is not hand-maintained and does not follow the house style.
extend-exclude = ["pkg/models/r4.py"]
