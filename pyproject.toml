[project]
# The FHIR trademark policy forbids combining the mark with other words, which ruled
# out `fhirforge`/`synthfhir`; `carebundle` carries no mark (build doc Section 15).
name = "carebundle"
version = "0.1.0"
description = "Clinically coherent synthetic FHIR(R) R4 test data for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["fhir", "healthcare", "synthetic-data", "test-data", "us-core", "hl7"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.scripts]
carebundle = "carebundle.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carebundle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "conformance: runs the HL7 validator (slow, needs a JVM)",
    "fidelity: statistical assertions over large seeded samples (slow)",
]

[tool.coverage.run]
source = ["carebundle"]
omit = [
    # Generated from the R4 spec and checked by the conformance gate, not by unit
    # tests; 886 statements of generated models would flatter the number.
    "carebundle/models/r4.py",
    # Offline build tooling, equivalent to build scripts. codegen is verified by the
    # stale-model check in CI, and the NHANES reader's parsing is unit-tested
    # through carebundle/calibration/xpt.py.
    "carebundle/spec/codegen.py",
    "carebundle/calibration/nhanes.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 90
# Generated code is not hand-maintained and does not follow the house style.
extend-exclude = ["carebundle/models/r4.py"]
